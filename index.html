<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meebo Terminal v3.0</title>
    <style>
        :root {
            --bg-main: #06060c;
            --bg-panel: rgba(13,13,25,0.7);
            --border-color: rgba(255,255,255,0.05);
            --accent-color: #0ebd84;
            --accent-hover: #0cb37d;
            --bubble-meebo: rgba(22,22,38,0.8);
            --bubble-text: #f1f1f1;
        }
        body {
            background-color: var(--bg-main);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .terminal-layout {
            display: grid;
            grid-template-columns: 320px 1fr 300px;
            gap: 20px;
            flex: 1;
            min-height: 0;
        }
        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .control-group { margin-bottom: 15px; }
        .control-item { margin: 8px 0; display: flex; align-items: center; gap: 8px; }
        select, input, button {
            background: #111122;
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 4px;
        }
        button { cursor: pointer; background: var(--accent-color); font-weight: bold; border: none;}
        button:hover { background: var(--accent-hover); }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <header>
        <h1>Meebo Terminal v3.0</h1>
        <button id="global-exit-btn">Exit Fullscreen</button>
    </header>
    <div class="terminal-layout">

        <!-- Window 1: Left Dashboard Control HUD -->
        <div class="panel" id="control-hud">
            <h3>### Meebo Control</h3>
            <div class="control-group">
                <label>Active Cognitive Brain</label>
                <select id="brain-select"></select>
                <div style="margin-top: 5px;">
                    <button id="rename-brain-btn">✏ Rename</button>
                    <button id="delete-brain-btn" style="background:#cc2222;">❌ Delete</button>
                </div>
            </div>
            <div class="control-group">
                <label>📂 Import JSON Profile</label>
                <input type="file" id="brain-upload" accept=".json">
            </div>
            <div class="control-group">
                <label>Generation Rules</label>
                <select id="mode-select">
                    <option value="grammar">Grammar Engine (Proper)</option>
                    <option value="chaotic">Chaotic Matrix (Random)</option>
                </select>
            </div>
            <div class="control-group">
                <label>Ingestion Strategy</label>
                <select id="learn-select">
                    <option value="adaptive">Adaptive Chat (Learn & Reply)</option>
                    <option value="silent">Silent Buffer (Learn Only)</option>
                </select>
            </div>
            <div class="control-group">
                <p>Stored Memory Keys: <span id="vocab-count">0</span></p>
                <div class="control-item">
                    <input type="checkbox" id="tts-toggle"> <label for="tts-toggle">Audio Text-to-Speech</label>
                </div>
                <div class="control-item">
                    <input type="checkbox" id="emotion-toggle"> <label for="emotion-toggle">Emotion Engine Vector</label>
                </div>
                <div class="control-item">
                    <input type="checkbox" id="smart-toggle" checked> <label for="smart-toggle">Smart Context Anchor</label>
                </div>
                <div class="control-item" style="border-top: 1px solid var(--border-color); padding-top: 8px;">
                    <input type="checkbox" id="long-toggle"> <label for="long-toggle" style="color: var(--accent-color); font-weight: bold;">Long Responses (10x Max Size)</label>
                </div>
            </div>
            <div style="margin-top: auto; display: flex; gap: 5px;">
                <button id="toggle-explorer-btn">🔍 Explorer</button>
                <button id="download-btn">💾 Export</button>
                <button id="open-settings-btn">⚙ System</button>
            </div>
        </div>

        <!-- Window 2: Center Communications Chat Terminal Area -->
        <div class="panel" style="flex: 1; min-width: 0;">
            <div id="chat-box" style="flex:1; overflow-y:auto; border-bottom:1px solid var(--border-color); padding-bottom:10px; margin-bottom:10px;"></div>
            <canvas id="visualizer-canvas" style="height: 60px; width: 100%; display: none; background: #000; border-radius: 4px; margin-bottom: 10px;"></canvas>
            <div id="emoji-panel" style="margin-bottom: 5px; display: flex; gap: 4px; flex-wrap: wrap;"></div>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="user-input" style="flex:1;" placeholder="Type or activate mic node to broadcast...">
                <button id="mic-btn">🎙 Mic</button>
                <button id="send-btn">Send Transmission</button>
            </div>
            <div style="margin-top: 5px; display: flex; gap: 5px;">
                <button id="expand-sidebar-btn">⛶ Full Control</button>
                <button id="expand-chat-btn">⛶ Full Terminal</button>
            </div>
            <div id="brain-explorer-container" style="display:none; max-height:200px; overflow-y:auto; margin-top:10px; background:#111122; padding:10px; border-radius:4px;"></div>
        </div>

        <!-- Window 3: Right Side Custom Theme Profiles Panel -->
        <div class="panel" id="customizer-panel">
            <h4>#### Terminal Environment Customizer</h4>
            <label>Theme Preset Profile:</label>
            <select id="theme-presets-select" style="width:100%; margin-bottom:10px;">
                <option value="emerald">Emerald Core</option>
                <option value="cyberpunk">Cyberpunk Neon</option>
                <option value="midnight">Midnight Violet</option>
                <option value="monochrome">Matrix Monochrome</option>
                <option value="custom">User Generated Custom</option>
            </select>
            <div id="custom-color-controls" style="opacity: 0.4; pointer-events: none; display: flex; flex-direction: column; gap: 8px;">
                <div class="control-item"><input type="color" id="color-bg-main" value="#06060c"> <label>Main Background</label></div>
                <div class="control-item"><input type="color" id="color-bg-panel" value="#0d0d19"> <label>Panel Sizing</label></div>
                <div class="control-item"><input type="color" id="color-accent" value="#0ebd84"> <label>System Accent</label></div>
                <div class="control-item"><input type="color" id="color-bubble" value="#161626"> <label>Signal Bubble</label></div>
            </div>
        </div>
    </div>

    <!-- Hidden Settings Backdrop Modal Container Interface -->
    <div id="settings-modal" class="panel" style="position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); display:none; z-index:100; background:#111122; max-width:400px; width:90%;">
        <h3>System Settings Modal</h3>
        <p>Chromebook layout core updates confirmed successfully.</p>
        <button id="close-settings-btn" style="align-self:flex-end;">Close System Configuration Menu</button>
    </div>

    <script src="meebo.js"></script>
</body>
</html>
