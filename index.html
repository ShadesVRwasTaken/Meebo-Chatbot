<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meebo Terminal v2.4</title>
    <style>
        :root {
            --bg-main: #0b0b10;
            --bg-panel: rgba(30,30,45,0.4);
            --border-color: rgba(255,255,255,0.08);
            --accent-color: #0ebd84;
            --accent-hover: #0cb37d;
            --bubble-meebo: #1e1e2d;
            --bubble-text: #f1f1f1;
        }
        body { background: var(--bg-main); color: #ffffff; font-family: system-ui, sans-serif; margin: 0; padding: 20px; display: flex; gap: 20px; height: 100vh; box-sizing: border-box; }
        .sidebar { width: 320px; background: var(--bg-panel); border: 1px solid var(--border-color); padding: 20px; display: flex; flex-direction: column; gap: 15px; border-radius: 8px; box-sizing: border-box; }
        .chat-container { flex: 1; display: flex; flex-direction: column; background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
        #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; border-radius: 8px; max-width: 80%; width: fit-content; word-break: break-word; }
        .user-msg { background: var(--accent-color); color: #000000; align-self: flex-end; }
        .meebo-msg { background: var(--bubble-meebo); color: var(--bubble-text); align-self: flex-start; }
        .system-msg { background: rgba(255,255,255,0.05); color: #8a8a9e; font-size: 0.85em; font-family: monospace; align-self: center; text-align: center; max-width: 100%; }
        .input-area { padding: 15px; border-top: 1px solid var(--border-color); display: flex; gap: 10px; align-items: center; background: rgba(0,0,0,0.2); }
        input[type="text"] { flex: 1; background: rgba(0,0,0,0.4); border: 1px solid var(--border-color); padding: 12px; color: #fff; border-radius: 6px; outline: none; }
        button, select { background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: #fff; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
        button:hover { background: var(--accent-hover); color: #000; }
        #visualizer-canvas { width: 100%; height: 40px; display: none; margin-top: 5px; }
        #brain-explorer-container { display: none; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); padding: 10px; border-radius: 6px; max-height: 250px; overflow-y: auto; font-family: monospace; font-size: 0.9em; }
        .brain-node { margin-bottom: 5px; border-left: 2px solid var(--accent-color); padding-left: 6px; }
        .brain-key { color: var(--accent-color); cursor: pointer; font-weight: bold; }
        .brain-values { display: none; color: #b5b5c8; margin-left: 10px; white-space: pre-wrap; }
        .brain-node.expanded .brain-values { display: block; }
        .emoji-panel { display: flex; flex-wrap: wrap; gap: 5px; padding: 5px; background: rgba(0,0,0,0.2); border-radius: 6px; }
        .emoji-btn { padding: 4px 8px; background: none; border: none; font-size: 1.2em; cursor: pointer; }
        .switch-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.02); padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border-color); }
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #121218; border: 1px solid var(--accent-color); padding: 20px; border-radius: 8px; z-index: 100; box-shadow: 0 0 20px rgba(0,240,255,0.15); }
    </style>
</head>
<body>

    <!-- 🦾 SIDEBAR: HARDWARE & COGNITIVE ENGINE SWITCHBOARD -->
    <div class="sidebar">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 style="margin:0; color:var(--accent-color);">Meebo Terminal</h3>
            <span style="font-size:0.75em; opacity:0.6;">Firmware v2.4</span>
        </div>
        
        <div>
            <label style="font-size:0.85em; opacity:0.7; display:block; margin-bottom:5px;">Active Brain Profile</label>
            <select id="brain-select" style="width:100%;"></select>
            <div style="display:flex; gap:5px; margin-top:5px;">
                <button id="rename-brain-btn" style="flex:1; font-size:0.8em;">✏ Rename</button>
                <button id="delete-brain-btn" style="flex:1; font-size:0.8em;">❌ Delete</button>
            </div>
            <!-- Hidden input engineered correctly to enable script mapping bridges -->
            <input type="file" id="brain-upload" accept=".json" style="display:none;">
            <button onclick="document.getElementById('brain-upload').click()" style="width:100%; margin-top:5px; font-size:0.85em;">📂 Import JSON Brain</button>
        </div>

        <hr style="border:0; border-top:1px solid var(--border-color); width:100%; margin:5px 0;">

        <div>
            <label style="font-size:0.85em; opacity:0.7; display:block; margin-bottom:5px;">Execution Profile</label>
            <select id="mode-select" style="width:100%;">
                <option value="grammar">Grammar (Proper)</option>
                <option value="chaotic">Chaotic (Random)</option>
            </select>
        </div>

        <div>
            <label style="font-size:0.85em; opacity:0.7; display:block; margin-bottom:5px;">Ingestion Engine</label>
            <select id="learn-select" style="width:100%;">
                <option value="adaptive">Adaptive (Chat & Learn)</option>
                <option value="silent">Silent (Learn Only)</option>
                <option value="off">Off (Respond Only)</option>
            </select>
            <div style="font-size:0.8em; margin-top:5px; opacity:0.8;">
                Memory Size: <span id="vocab-count" style="color:var(--accent-color); font-weight:bold;">0</span>
            </div>
        </div>

        <hr style="border:0; border-top:1px solid var(--border-color); width:100%; margin:5px 0;">

        <div class="switch-row">
            <span>Audio Text-to-Speech</span>
            <input type="checkbox" id="tts-toggle">
        </div>
        <div class="switch-row">
            <span>Emotion Engine Loop</span>
            <input type="checkbox" id="emotion-toggle">
        </div>
        <div class="switch-row">
            <span>Smart Context Anchor</span>
            <input type="checkbox" id="smart-toggle" checked>
        </div>

        <div style="display:flex; gap:5px; margin-top:auto;">
            <button id="toggle-explorer-btn" style="flex:1;">🔍 Explorer</button>
            <button id="download-btn" style="flex:1;">💾 Export</button>
            <button id="open-settings-btn">⚙️</button>
        </div>

        <!-- 🧠 RESOLVED HOOK: Added the missing DOM target container for the Brain Explorer engine -->
        <div id="brain-explorer-container"></div>
    </div>

    <!-- 💬 MAIN SYSTEM: CONSOLE TERMINAL CHAT LAYER -->
    <div class="chat-container">
        <div style="display:flex; background:rgba(0,0,0,0.2); padding:10px; border-bottom:1px solid var(--border-color); align-items:center; justify-content:space-between;">
            <div style="display:flex; gap:5px;">
                <button id="expand-sidebar-btn" style="padding:4px 8px; font-size:0.8em;">⛶ Sidebar</button>
                <button id="expand-chat-btn" style="padding:4px 8px; font-size:0.8em;">⛶ Chat</button>
            </div>
            <!-- Audio overlay analytics canvas hook -->
            <canvas id="visualizer-canvas"></canvas>
        </div>

        <div id="chat-box">
            <div class="msg system-msg">System diagnostic active. Audio canvas pipelines mapped directly on terminal text interfaces. Welcome back.</div>
        </div>

        <div id="emoji-panel" class="emoji-panel"></div>

        <div class="input-area">
            <button id="mic-btn" type="button" style="font-size:1.2em; padding:8px 10px;">🎙️</button>
            <input type="text" id="user-input" placeholder="Type a message to Meebo..." autocomplete="off">
            <button id="send-btn" style="background:var(--accent-color); color:#000; font-weight:bold; padding:10px 20px;">Send</button>
        </div>
    </div>

    <!-- 🛠️ INTERFACE OPTIONS CONFIGURATION POPUP OVERLAY -->
    <div id="settings-modal" class="modal">
        <h3 style="margin-top:0; color:var(--accent-color);">Terminal Interface Settings</h3>
        <label style="display:block; margin-bottom:10px;">
            Theme Preset:
            <select id="theme-presets-select" style="width:100%; margin-top:5px;">
                <option value="emerald">Emerald Core</option>
                <option value="cyberpunk">Cyberpunk Neon</option>
                <option value="midnight">Midnight Violet</option>
                <option value="monochrome">Matrix Monochrome</option>
                <option value="custom">User Generated Custom</option>
            </select>
        </label>
        <div id="custom-color-controls" style="display:flex; flex-direction:column; gap:8px; opacity:0.4; pointer-events:none; margin-bottom:15px;">
            <label style="display:flex; justify-content:space-between;">Main Terminal Background <input type="color" id="color-bg-main" value="#0b0b10"></label>
            <label style="display:flex; justify-content:space-between;">Dashboard Interface Panel <input type="color" id="color-bg-panel" value="#1e1e2d"></label>
            <label style="display:flex; justify-content:space-between;">System Accent Pipeline <input type="color" id="color-accent" value="#0ebd84"></label>
            <label style="display:flex; justify-content:space-between;">Meebo Chat Bubble Hue <input type="color" id="color-bubble" value="#1e1e2d"></label>
        </div>
        <button id="close-settings-btn" style="width:100%;">Save and Terminate Dialog</button>
    </div>

    <script src="meebo.js"></script>
</body>
</html>
