<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat with Meebo</title>
<style>
body { font-family: sans-serif; background-color: #1a1a24; color: #fff; max-width: 600px; margin: 20px auto; padding: 10px; display: flex; flex-direction: column; height: 90vh; }
h1 { color: #0ebd84; margin: 5px 0; text-align: center; }
#chat-box { flex: 1; background: #242432; border-radius: 8px; padding: 15px; overflow-y: auto; border: 1px solid #333344; margin-bottom: 10px; }
.msg { margin-bottom: 10px; padding: 8px 12px; border-radius: 6px; max-width: 80%; word-break: break-word; }
.user-msg { background: #0ebd84; color: #fff; align-self: flex-end; margin-left: auto; }
.meebo-msg { background: #333344; color: #fff; align-self: flex-start; }
.system-msg { background: #f44336; color: #fff; text-align: center; max-width: 100%; font-family: monospace; }
#input-area { display: flex; gap: 10px; }
input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #333344; background: #1a1a24; color: #fff; }
button { padding: 10px 20px; border-radius: 6px; border: none; background: #0ebd84; color: white; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>

<h1>🤖 Meebo Web Chat</h1>
<div id="chat-box">
<div class="msg meebo-msg">Hello! I am Meebo. Talk to me to teach me sentences!</div>
</div>

<div id="input-area">
<input type="text" id="user-input" placeholder="Type a message to Meebo..." autocomplete="off">
<button id="send-btn">Send</button>
</div>

<script src="meebo.js"></script>
</body>
</html>
